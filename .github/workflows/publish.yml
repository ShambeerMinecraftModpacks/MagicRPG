name: Publish Modpack

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v2.1.7)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - if: github.event_name == 'release'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download ${{ github.event.release.tag_name }} --pattern "*.mrpack"

      - if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download ${{ inputs.version }} --pattern "*.mrpack"

      - uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: PrEKrBpK
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: "*.mrpack"
          version: ${{ github.event.release.tag_name || inputs.version }}