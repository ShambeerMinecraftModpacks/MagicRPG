# Configuration file

##########################################################################################################
# general
#--------------------------------------------------------------------------------------------------------#
# Please note that changing some of these settings may make the mod very difficult to play.
##########################################################################################################

general {
    # Rarity of wizard towers. Higher numbers are rarer. Set to 0 to disable wizard towers completely.
    I:towerRarity=8

    # The chance for mobs to drop a spell book when killed. The greater this number, the more often they will drop. Set to 0 to disable spell book drops. Set to 200 for guaranteed drops.
    I:spellBookDropChance=3

    # List of dimension ids in which crystal ore will generate. Note that removing the overworld (id 0) from this list will make the mod VERY difficult to play!
    I:oreDimensions <
        0
     >

    # List of dimension ids in which crystal flowers will generate.
    I:flowerDimensions <
        0
     >

    # List of dimension ids in which wizard towers will generate.
    I:towerDimensions <
        0
     >

    # Whether to generate wizardry loot in dungeon chests.
    B:generateLoot=true

    # Whether firebombs can be crafted or not.
    B:firebombIsCraftable=true

    # Whether poison bombs can be crafted or not.
    B:poisonBombIsCraftable=true

    # Whether smoke bombs can be crafted or not.
    B:smokeBombIsCraftable=true

    # Whether to require a magic crystal in the shapeless crafting recipe for blank scrolls. Set to true if another mod adds a conflicting recipe.
    B:useAlternateScrollRecipe=false

    # Whether players are allowed to teleport through unbreakable blocks (e.g. bedrock) using the phase step spell.
    B:teleportThroughUnbreakableBlocks=false

    # Whether to show summoned creatures' names and owners above their heads.
    B:showSummonedCreatureNames=true

    # Whether to allow players to damage their designated allies using magic.
    B:friendlyFire=true

    # Whether to allow players to disarm other players using the telekinesis spell. Set to false to prevent stealing of items.
    B:telekineticDisarmament=true

    # For those who like a sense of mystery! When set to true, spells you haven't cast yet will be unreadable until you cast them (on a per-world basis). Has no effect when in creative mode. Spells of identification will be unobtainable in survival mode if this is false.
    B:discoveryMode=true

    # Whether you can switch between spells on a wand by scrolling with the mouse wheel while sneaking. Note that this will only affect you; other players connected to the same server obey their own settings.
    B:enableShiftScrolling=true

    # Whether summoned creatures can revenge attack their owner if their owner attacks them.
    B:minionRevengeTargeting=true

    # Global damage scaling factor for the damage dealt by players casting spells, relative to 1.
    D:playerDamageScaling=1.0

    # Global damage scaling factor for the damage dealt by NPCs casting spells, relative to 1.
    D:npcDamageScaling=1.0

    # Upper limit for the multipliers passed into the /cast command. This is here to stop players from accidentally breaking a world/server. Large blast mutipliers can cause extreme lag - you have been warned!
    D:castCommandMultiplierLimit=20.0

    # List of names of entities which summoned creatures and wizards are allowed to attack, in addition to the defaults. Add mod creatures to this list if you want summoned creatures to attack them and they aren't already doing so. Entity names are not case sensitive. For mod entities, prefix with the mod ID (e.g. wizardry:Wizard).
    S:summonedCreatureTargetsWhitelist <
     >

    # List of names of entities which summoned creatures and wizards are specifically not allowed to attack, overriding the defaults and the whitelist. Add creatures to this list if allowing them to be attacked causes problems or is too destructive (removing creepers from this list is done at your own risk!). Entity names are not case sensitive. For mod entities, prefix with the mod ID (e.g. wizardry:Wizard).
    S:summonedCreatureTargetsBlacklist <
        creeper
     >

    # The position of the spell HUD.
    S:spellHUDPosition=Bottom left

    # The name of the /cast command. This is what you type directly after the /; for example if this was set to 'magic' then instead of typing /cast you would type /magic instead.
    S:castCommandName=cast

    # The name of the /discoverspell command. This is what you type directly after the /; for example if this was set to 'magic' then instead of typing /discoverspell you would type /magic instead.
    S:discoverspellCommandName=discoverspell

    # The name of the /ally command. This is what you type directly after the /; for example if this was set to 'magic' then instead of typing /ally you would type /magic instead.
    S:allyCommandName=ally

    # The name of the /allies command. This is what you type directly after the /; for example if this was set to 'magic' then instead of typing /allies you would type /magic instead.
    S:alliesCommandName=allies
}


##########################################################################################################
# ids
#--------------------------------------------------------------------------------------------------------#
# Change these IDs if they conflict with another mod.
##########################################################################################################

ids {
    # The ID of the frost potion effect. Change if this conflicts with another mod.
    I:frostPotionID=31

    # The ID of the transience potion effect. Change if this conflicts with another mod.
    I:transiencePotionID=32

    # The ID of the fireskin potion effect. Change if this conflicts with another mod.
    I:fireskinPotionID=33

    # The ID of the ice shroud potion effect. Change if this conflicts with another mod.
    I:iceShroudPotionID=34

    # The ID of the static aura potion effect. Change if this conflicts with another mod.
    I:staticAuraPotionID=35

    # The ID of the decay potion effect. Change if this conflicts with another mod.
    I:decayPotionID=36

    # The ID of the sixth sense potion effect. Change if this conflicts with another mod.
    I:sixthSensePotionID=37

    # The ID of the arcane jammer potion effect. Change if this conflicts with another mod.
    I:arcaneJammerPotionID=38

    # The ID of the mind trick potion effect. Change if this conflicts with another mod.
    I:mindTrickPotionID=39

    # The ID of the mind control potion effect. Change if this conflicts with another mod.
    I:mindControlPotionID=40

    # The ID of the font of mana potion effect. Change if this conflicts with another mod.
    I:fontOfManaPotionID=41

    # The ID of the fear potion effect. Change if this conflicts with another mod.
    I:fearPotionID=42

    # The ID of the magic sword enchantment. Change if this conflicts with another mod.
    I:magicSwordEnchantmentID=100

    # The ID of the magic bow enchantment. Change if this conflicts with another mod.
    I:magicBowEnchantmentID=101

    # The ID of the flaming weapon enchantment. Change if this conflicts with another mod.
    I:flamingWeaponEnchantmentID=102

    # The ID of the freezing weapon enchantment. Change if this conflicts with another mod.
    I:freezingWeaponEnchantmentID=103
}


##########################################################################################################
# resistances
#--------------------------------------------------------------------------------------------------------#
# These options allow entities to be made immune to certain types of magic.
##########################################################################################################

resistances {
    # List of names of entities that are immune to fire, in addition to the defaults. Add mod creatures to this list if you want them to be immune to fire magic and they aren't already. Entity names are not case sensitive. For mod entities, prefix with the mod ID (e.g. wizardry:Wizard).
    S:mobsImmuneToFire <
     >

    # List of names of entities that are immune to ice, in addition to the defaults. Add mod creatures to this list if you want them to be immune to ice magic and they aren't already. Entity names are not case sensitive. For mod entities, prefix with the mod ID (e.g. wizardry:Wizard).
    S:mobsImmuneToIce <
     >

    # List of names of entities that are immune to lightning, in addition to the defaults. Add mod creatures to this list if you want them to be immune to lightning magic and they aren't already. Entity names are not case sensitive. For mod entities, prefix with the mod ID (e.g. wizardry:Wizard).
    S:mobsImmuneToLightning <
     >

    # List of names of entities that are immune to wither effects, in addition to the defaults. Add mod creatures to this list if you want them to be immune to withering magic and they aren't already. Entity names are not case sensitive. For mod entities, prefix with the mod ID (e.g. wizardry:Wizard).
    S:mobsImmuneToWither <
     >

    # List of names of entities that are immune to poison, in addition to the defaults. Add mod creatures to this list if you want them to be immune to poison magic and they aren't already. Entity names are not case sensitive. For mod entities, prefix with the mod ID (e.g. wizardry:Wizard).
    S:mobsImmuneToPoison <
     >
}


##########################################################################################################
# spells
#--------------------------------------------------------------------------------------------------------#
# Set a spell to false to disable it. Disabled spells will still have their associated spell book (mainly so the spell books don't all change) and can still be bound to wands, but cannot be cast in game, will not appear in any subsequently generated chests or wizard trades and will not drop from mobs. Disable a spell if it is causing problems, conflicts with another mod or creates an unintended exploit.
##########################################################################################################

spells {
    # Увеличивает скорость передвижения и высоту прыжка заклинателя на 30 секунд.
    B:agility=true

    # Выпускает в цель электрическую искру.
    B:arc=true

    # Не позволяет цели использовать магию в течение 15 секунд.
    B:arcane_jammer=true

    # «Лучники, огонь!»
    B:arrow_rain=true

    # Телепортирует цель против её воли в случайное место в определенном радиусе.
    B:banish=true

    # Разорвите ткань реальности на части.
    B:black_hole=true

    # Телепортирует заклинателя на короткое расстояние туда, куда он указывает.
    B:blink=true

    # Создает зону кружащегося ледяного ветра, который замедляет и постоянно наносит урон всем, кто находится внутри. Заклинатель не получает урона, но всё равно замедляется.
    B:blizzard=true

    # Выпускает поток пузырей, заставляя всё, во что они попадут, беспомощно всплывать вверх. Цель упадет через определенное время или при получении урона.
    B:bubble=true

    # Выпускает в цель электрическую искру, которая затем перескакивает на другие цели (до двух раз).
    B:chain_lightning=true

    # Показывает путь к сохраненному месту. Выбрав это заклинание, нажмите Shift+ПКМ по блоку, чтобы сохранить местоположение. Сотворите заклинание как обычно, чтобы увидеть путь. Путь исчезнет через 90 секунд.
    B:clairvoyance=true

    # Создает паутину там, куда вы указываете, значительно затрудняя передвижение любых существ, попавших в неё. Паутина исчезнет через 20 секунд или если её сломать.
    B:cobwebs=true

    # Создает вокруг заклинателя призрачную броню, дающую защиту, равную железной. Броня держится 60 секунд. У заклинателя должен быть свободный слот брони.
    B:conjure_armour=true

    # Создает спектральный лук с бесконечными стрелами на 30 секунд.
    B:conjure_bow=true

    # Создает спектральную кирку (по прочности равна железной) на 30 секунд.
    B:conjure_pickaxe=true

    # Создает спектральный меч (по урону равен железному) на 30 секунд.
    B:conjure_sword=true

    # Снимает с заклинателя все текущие эффекты зелий, как хорошие, так и плохие.
    B:cure_effects=true

    # Неразрывно связывает душу цели с душой заклинателя, из-за чего весь урон, получаемый заклинателем, также наносится и жертве. Действует до смерти одного из них.
    B:curse_of_soulbinding=true

    # Выпускает медленно летящий сгусток темной энергии, иссушающий всё, во что попадает.
    B:darkness_orb=true

    # Дарует заклинателю ночное зрение на 45 секунд.
    B:darkvision=true

    # Выпускает дротик, наносящий урон и ослабляющий цель.
    B:dart=true

    # Создает на земле область разложения, заражающую любое коснувшееся её существо, нанося периодический урон и заставляя жертву распространять разложение при ходьбе.
    B:decay=true

    # Создает иллюзорного двойника заклинателя, отвлекающего на себя монстров. Приманка исчезнет через 30 секунд.
    B:decoy=true

    # Вызывает взрыв в указанной точке, нанося урон всем ближайшим существам, включая самого заклинателя, если он находится слишком близко.
    B:detonate=true

    # «Твои стрелы мне нипочем!»
    B:diamondflesh=true

    # Истинный мастер магии земли способен сдвигать горы.
    B:earthquake=true

    # Ловит цель в сферу тьмы, которая беспомощно тянет её вверх и постоянно наносит урон.
    B:entrapment=true

    # Дарует огнестойкость на 30 секунд.
    B:fire_resistance=true

    # Устанавливает на земле магическую огненную ловушку, наносящую урон и поджигающую наступившее на неё существо.
    B:fire_sigil=true

    # Запускает огненный шар в указанном направлении.
    B:fireball=true

    # Выстреливает струей огня на небольшое расстояние.
    B:firebolt=true

    # Бросает зажигательную бомбу, взрывающуюся при ударе и поджигающую цели.
    B:firebomb=true

    # Окутывает заклинателя пламенем на 30 секунд, заставляя любого атакующего загореться.
    B:fireskin=true

    # «Я — дракон».
    B:firestorm=true

    # Создает поток пламени, поджигающий и постоянно наносящий урон целям.
    B:flame_ray=true

    # Создает пылающий топор, поджигающий врагов при ударе. Действует 30 секунд.
    B:flaming_axe=true

    # Временно наполняет первое оружие на панели быстрого доступа силой пламени, заставляя его поджигать врагов. Магия рассеивается через 45 секунд.
    B:flaming_weapon=true

    # Пари как орел.
    B:flight=true

    # «Нас наполнила невероятная магическая энергия, казалось, исходившая из центра...» — Выдержка из дневника забытого мага; остальная часть страницы сгорела.
    B:font_of_mana=true

    # Ощущения просто потрясающие.
    B:font_of_vitality=true

    # Выпускает стрелу чистой силы.
    B:force_arrow=true

    # Запускает сферу силы, наносящую урон и отбрасывающую существ при столкновении.
    B:force_orb=true

    # Создает вокруг заклинателя силовое поле, отталкивающее существ и отражающее снаряды.
    B:forcefield=true

    # «Как ты смеешь входить в мой лес!»
    B:forests_curse=true

    # Замораживает цель на 10 секунд. Также замораживает воду и создает снег на земле.
    B:freeze=true

    # Временно наполняет первое оружие на панели силой мороза, позволяя замораживать врагов. Эффект спадает через 45 секунд.
    B:freezing_weapon=true

    # Создает ледяной топор, замораживающий врагов при ударе. Действует 30 секунд.
    B:frost_axe=true

    # Создает поток холода, замедляющий и наносящий постоянный урон целям.
    B:frost_ray=true

    # Устанавливает на земле магическую ледяную ловушку, наносящую урон и замораживающую наступившее существо.
    B:frost_sigil=true

    # Позволяет заклинателю плавно планировать вниз, находясь в воздухе (необходимо удерживать кнопку использования).
    B:glide=true

    # Запускает большой огненный шар, взрывающийся при попадании.
    B:greater_fireball=true

    # Исцеляет заклинателя на 4 сердца.
    B:greater_heal=true

    # Исцеляет заклинателя, а также всех ближайших союзников и призванных существ на 3 сердца.
    B:group_heal=true

    # Ускоряет рост всех культур рядом с заклинателем. Также выращивает высокую траву и цветы на блоках травы.
    B:growth_aura=true

    # Именно во время великой зимы третьей эпохи маги льда открыли свою истинную силу.
    B:hailstorm=true

    # Исцеляет заклинателя на 2 сердца.
    B:heal=true

    # Исцеляет цель на 2.5 сердца.
    B:heal_ally=true

    # Создает зону исцеляющей энергии, восстанавливающую здоровье союзникам. Любая нежить внутри ауры будет медленно получать урон.
    B:healing_aura=true

    # Создает парящую искру, самонаводящуюся на врагов.
    B:homing_spark=true

    # «Ты замерзнешь на целую вечность!»
    B:ice_age=true

    # Запускает ледяной заряд, который при взрыве замораживает существ и разбрасывает осколки во все стороны.
    B:ice_charge=true

    # Выпускает огромное ледяное копье, пробивающее цели насквозь, нанося урон и замораживая их.
    B:ice_lance=true

    # Выпускает ледяной осколок, наносящий урон и замедляющий цель.
    B:ice_shard=true

    # Окружает заклинателя ледяной пеленой на 30 секунд, замораживая любого, кто его атакует.
    B:ice_shroud=true

    # Вызывает появление острых ледяных шипов из-под земли, пронзающих попавших в них существ.
    B:ice_spikes=true

    # Превращает цель в глыбу льда на 20 секунд (или пока лёд не сломают). Замороженная цель не может действовать, но полностью неуязвима к урону.
    B:ice_statue=true

    # Поджигает цель на 10 секунд. Также работает как обычное огниво.
    B:ignite=true

    # Временно усиливает первое оружие на панели быстрого доступа магией, повышая его урон. Действует 45 секунд.
    B:imbue_weapon=true

    # Издает устрашающий рык, заставляющий ближайших существ в страхе разбегаться. Существа придут в себя через 30 секунд.
    B:intimidate=true

    # Дарует заклинателю и всем ближайшим союзникам повышенную силу на 45 секунд.
    B:invigorating_presence=true

    # Делает заклинателя невидимым на 30 секунд.
    B:invisibility=true

    # Изменяет погоду в мире.
    B:invoke_weather=true

    # Значительно повышает сопротивление урону на 30 секунд.
    B:ironflesh=true

    # Позволяет заклинателю совершить мощный прыжок вверх и немного вперед.
    B:leap=true

    # Поднимает заклинателя в воздух, пока удерживается кнопка использования. Помогает избежать урона от падения, если применить заклинание перед приземлением.
    B:levitation=true

    # Создает поток иссушающей энергии, вытягивающий жизненные силы из цели и исцеляющий заклинателя.
    B:life_drain=true

    # Создает парящий магический огонек, освещающий пространство вокруг. Держится 30 секунд.
    B:light=true

    # Выпускает стрелу, сотканную из молний.
    B:lightning_arrow=true

    # Бьет молнией в указанную точку.
    B:lightning_bolt=true

    # Запускает электрический диск, самонаводящийся на цели.
    B:lightning_disc=true

    # «Я покараю тебя гневом небес!»
    B:lightning_hammer=true

    # Заряжает землю вокруг заклинателя электричеством, нанося урон и отбрасывая существ.
    B:lightning_pulse=true

    # Создает поток молний, наносящий постоянный урон.
    B:lightning_ray=true

    # Устанавливает на земле магическую электрическую ловушку, поражающую наступившее существо и пускающую цепную молнию по ближайшим врагам.
    B:lightning_sigil=true

    # «Сконцентрируйся. Направь бурю в своем разуме через жезл и обрушь её ярость».
    B:lightning_web=true

    # Выпускает сгусток чистой магической энергии.
    B:magic_missile=true

    # Превращает цель в другое существо. Работает не на всех.
    B:metamorphosis=true

    # Некоторые волшебники просто хотят видеть, как мир горит...
    B:meteor=true

    # Берет разум цели под контроль на 30 секунд, заставляя её перейти на сторону заклинателя. Не подействует на существ с сильной волей.
    B:mind_control=true

    # Сбивает цель с толку на 15 секунд, не давая ей нормально атаковать. Эффект рассеется, если цель получит урон.
    B:mind_trick=true

    # Повышает сопротивление урону на 30 секунд.
    B:oakflesh=true

    # Превращает цель в камень до освобождения (есть шанс, что окаменение спадет в темноте). Окаменевшая цель не может двигаться, но полностью неуязвима к урону.
    B:petrify=true

    # Телепортирует заклинателя сквозь стену толщиной в 1 блок. Улучшения дальности увеличивают толщину пробиваемой стены.
    B:phase_step=true

    # Тьма поглотит их всех...
    B:plague_of_darkness=true

    # Переплавляет до 5 предметов в инвентаре заклинателя. Предметы на панели быстрого доступа переплавляются первыми.
    B:pocket_furnace=true

    # Позволяет заклинателю создавать предметы без верстака.
    B:pocket_workbench=true

    # Выплескивает струю яда.
    B:poison=true

    # Бросает ядовитую бомбу, взрывающуюся при ударе и отравляющую существ вокруг.
    B:poison_bomb=true

    # Восстанавливает заклинателю 3 деления голода.
    B:replenish_hunger=true

    # Создает огненное кольцо вокруг заклинателя, нанося урон и поджигая врагов.
    B:ring_of_fire=true

    # Воздвигает стену тьмы, которая возвращает атакующему половину полученного заклинателем урона.
    B:shadow_ward=true

    # Создает защитный силовой барьер, блокирующий снаряды и магию. Также дает заклинателю слабый эффект сопротивления урону.
    B:shield=true

    # Бум.
    B:shockwave=true

    # «А-а-а! Они РАЗМНОЖАЮТСЯ!»
    B:silverfish_swarm=true

    # Позволяет заклинателю чувствовать присутствие существ сквозь стены в течение 20 секунд.
    B:sixth_sense=true

    # Поглощает цель слизью, замедляя её и нанося постоянный урон. Слизь лопается через 10 секунд.
    B:slime=true

    # Бросает дымовую бомбу, ослепляющую существ в зоне поражения на короткое время.
    B:smoke_bomb=true

    # Устанавливает на земле капкан, наносящий урон и ненадолго замедляющий наступившее существо.
    B:snare=true

    # Бросает снежок.
    B:snowball=true

    # Бросает шоковый заряд, при взрыве поражающий врагов искрами.
    B:spark_bomb=true

    # Создает неразрушимый магический мост длиной в 15 блоков. Мост исчезнет через 60 секунд.
    B:spectral_pathway=true

    # Призывает рой ядовитых пауков, сражающихся на вашей стороне. Пауки исчезнут через 30 секунд (или если их убьют).
    B:spider_swarm=true

    # Окружает заклинателя электричеством на 30 секунд, поражая молниями любого, кто нанесет ему удар.
    B:static_aura=true

    # Призывает ифрита, сражающегося на вашей стороне. Ифрит исчезнет через 30 секунд.
    B:summon_blaze=true

    # «Раздави их!»
    B:summon_ice_giant=true

    # Призывает ледяного духа, сражающегося на вашей стороне. Дух исчезнет через 30 секунд.
    B:summon_ice_wraith=true

    # Автоматизированный автономный автоматон.
    B:summon_iron_golem=true

    # Призывает духа бури, сражающегося на вашей стороне. Дух исчезнет через 30 секунд.
    B:summon_lightning_wraith=true

    # Восставший из пепла...
    B:summon_phoenix=true

    # §kПризывает теневого духа, сражающегося на вашей стороне.
    B:summon_shadow_wraith=true

    # Призывает скелета, сражающегося на вашей стороне. Скелет исчезнет через 30 секунд.
    B:summon_skeleton=true

    # «Восстаньте, армия нежити!»
    B:summon_skeleton_legion=true

    # Создает снежного голема. Держится, пока голем не умрет.
    B:summon_snow_golem=true

    # Призывает призрачную лошадь. Лошадь исчезнет через некоторое время после спешивания. Её также можно отозвать, нажав Shift+ПКМ любым жезлом.
    B:summon_spirit_horse=true

    # Призывает призрачного волка-компаньона. Волк исчезнет только в случае гибели, либо его можно отозвать, нажав Shift+ПКМ любым жезлом.
    B:summon_spirit_wolf=true

    # «Элементаль бури: Древнее воплощение стихий. Он едва способен сдерживать бушующую внутри него силу» — Справочник мага по тайным созданиям, Том II.
    B:summon_storm_elemental=true

    # Призывает скелета-иссушителя. Скелет исчезнет через 30 секунд.
    B:summon_wither_skeleton=true

    # Призывает зомби, сражающегося на вашей стороне. Зомби исчезнет через 30 секунд.
    B:summon_zombie=true

    # Притягивает к себе предмет (или небольшого моба), либо имитирует нажатие ПКМ по блоку. Также может использоваться для обезоруживания игроков.
    B:telekinesis=true

    # Выпускает удар грома, отбрасывающий цели.
    B:thunderbolt=true

    # «Муа-ха-ха-ха-ха!»
    B:thunderstorm=true

    # Вызывает торнадо, подбрасывающий высоко в небо всё на своем пути.
    B:tornado=true

    # Делает заклинателя бесплотным на 20 секунд. В этом состоянии он полностью неуязвим ко всему урону, но не может наносить урон, а также ломать или ставить блоки.
    B:transience=true

    # Перемещает заклинателя к сохраненному кругу камней. Для использования постройте круг из камней перемещения и нажмите по нему ПКМ с выбранным заклинанием.
    B:transportation=true

    # Дает заклинателю удаленный доступ к его эндер-сундуку.
    B:vanishing_box=true

    # Зима на кончиках пальцев.
    B:wall_of_frost=true

    # Позволяет заклинателю дышать под водой в течение 60 секунд.
    B:water_breathing=true

    # Подбрасывает цель в воздух и отбрасывает от вас на высокой скорости.
    B:whirlwind=true

    # Выпускает луч тьмы, иссушающий всё, чего коснется.
    B:wither=true

    # Запускает череп иссушителя.
    B:wither_skull=true
}


