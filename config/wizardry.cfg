    B:replenish_hunger=true

    # Создает Огненное Кольцо Вокруг Заклинателя, Нанося Урон Всем Ближайшим Противникам И Поджигая Их.
    B:ring_of_fire=true

    # Создает Стену Тьмы Перед Заклинателем, Которая Наносит Нападающему Половину Всего Входящего Урона.
    B:shadow_ward=true

    # Создает Защитный Барьер Силы, Который Блокирует Снаряды И Магию. Также Дает Заклинателю Слабый Эффект Сопротивления.
    B:shield=true

    # Бум.
    B:shockwave=true

    # "ААААА! ИХ ОЧЕНЬ МНОГО!"
    B:silverfish_swarm=true

    # Allows the caster to sense the locations of nearby creatures, even through walls, for 20 seconds.
    B:sixth_sense=true

    # Охватывает Цель Слизью, Которая Замедляет И Постоянно Её Повреждает. Слизь Разрывается Через 10 Секунд.
    B:slime=true

    # Launches a smoke bomb in the direction you are pointing which explodes on impact, releasing smoke and blinding nearby creatures for a short time.
    B:smoke_bomb=true

    # Устанавливает Ловушку На Земле, Которая Наносит Урон И Кратко Замедляет Существо, Которое Наступило На Ловушку.
    B:snare=true

    # Launches a snowball in the direction you are pointing.
    B:snowball=true

    # Запускает Бомбу Искр В Том Направлении, В Котором Вы Указываете. Искры Появляются У Ближайших Противников При Ударе.
    B:spark_bomb=true

    # Создает Перед Вами Неразрушимый Магический Мост, Который Простирается На 15 Блоков. Через 60 Секунд Мост Исчезает.
    B:spectral_pathway=true

    # Призывает Рой Ядовитых Пауков, Чтобы Сражаться За Вас. Пауки Исчезнут Через 30 Секунд Или Если Они Будут Убиты.
    B:spider_swarm=true

    # Окружает Заклинателя Молнией В Течение 30 Секунд, Стреляет Искрами Молнии Во Все, Что Ударит Вас.
    B:static_aura=true

    # Призывает Блейза, Чтобы Сражаться За Вас. Блейз Исчезнет Через 30 Секунд Или Если Он Будет Убит.
    B:summon_blaze=true

    # "Разбей Их!"
    B:summon_ice_giant=true

    # Призывает Ледяного Призрака, Который Сражается За Вас. Ледяной Призрак Исчезнет Через 30 Секунд Или Если Он Будет Убит.
    B:summon_ice_wraith=true

    # Автоматический Автономный Автомат.
    B:summon_iron_golem=true

    # Призывает Молниеносного Призрака Сражаться За Вас. Молниеносный Призрак Исчезнет Через 30 Секунд Или Если Он Будет Убит.
    B:summon_lightning_wraith=true

    # Из Пепла...
    B:summon_phoenix=true

    # §kПризывает Тёмного Призрака, Который Будет Сражаться За Вас.
    B:summon_shadow_wraith=true

    # Призывает Скелета, Который Сражается За вас. Скелет Исчезнет Через 30 Секунд Или Если Он Будет Убит.
    B:summon_skeleton=true

    # "Восстань, Армия Нежети!"
    B:summon_skeleton_legion=true

    # Создает Снежного Голема, Который Сражается За Вас. Длится До Тех Пор, Пока Не Умрет Снежный Голем.
    B:summon_snow_golem=true

    # Призывает Для Вас Верховую Лошадь. Призрачная Лошадь Исчезнет Через Некоторое Время После Того, Как Вы С Неё Слезите, Или Вы Можете Убрать Её С Помощью Жезла - Щелкните Правой Кнопкой Мыши На Ней.
    B:summon_spirit_horse=true

    # Призывает Спутника Духа Волка, Который Сражается За Вас. Призрачный Волк Исчезнет, Только Если Его Убьют, Или Вы Можете Его Убрать, Щелкнув Правой Кнопкой Мыши На Нём С Помощью Жезла.
    B:summon_spirit_wolf=true

    # "Storm Elemental: An ancient manifestation of the elements, it can hardly contain the raw power churning within it." - The Wizard's Guide to Arcane Beings, Volume II
    B:summon_storm_elemental=true

    # Призывает Скелета-Иссушителя, Который Сражается За Вас. Скелет-Иссушитель Исчезнет Через 30 Секунд Или Если Он Будет Убит.
    B:summon_wither_skeleton=true

    # Призывает Зомби, Который Сражается За Вас. Зомби Исчезнет Через 30 Секунд Или Если Он Будет Убит.
    B:summon_zombie=true

    # Перемещает Объект Или Другой Маленький Объект К Себе Или Щелкает Правой Кнопкой Мыши На Блоке,На Который Вы Смотрите.
    B:telekinesis=true

    # Стреляет Громом, Который Отбрасывает Цели.
    B:thunderbolt=true

    # "МУХАХАХАХАХ!"
    B:thunderstorm=true

    # Развязывает Торнадо В Направлении, На Которое Вы Указываете, Который Бросает Что-либо На Своем Пути В Небо.
    B:tornado=true

    # Делает Переход Заклинателя На 20 Секунд. Заклинатель Невосприимчив Ко Всему Урону В Переходный Период, Но Не Может Сломать Или Поместить Блоки Или Нанести Какой-либо Урон.
    B:transience=true

    # Транспортирует Заклинателя В Запомненный Каменный Круг. Чтобы Использовать Это Заклинание, Сделайте Круг Камней Транспортировки, Затем Щелкните Правой Кнопкой Мыши С Помощью Жезла.
    B:transportation=true

    # Grants the caster access to their ender chest storage.
    B:vanishing_box=true

    # Зима У Вас Под Рукой.
    B:wall_of_frost=true

    # Позволяет Заклинателю Дышать Под Водой В Течение 60 Секунд.
    B:water_breathing=true

    # Заставляет Цель Взлететь Вверх Далеко От Вас На Скорости.
    B:whirlwind=true

    # Стреляет Лучом Тьмы, Который Увядает Всё, К Чему Он Прикасается.
    B:wither=true

    # Запускает Череп Иссушителя В Направлении, На Которое Вы Указываете.
    B:wither_skull=true
}


